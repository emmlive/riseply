name: Discord nudges

# Trigger for Discord practice nudges, streak reminders and weekly recaps,
# every 3 hours. Each connection chooses its own local hour and timezone;
# this job just runs on the schedule and the backend decides who is due (at
# most one nudge per person per local day, one recap per week), so a late,
# skipped or doubled run is harmless.
#
# Why every 3 hours and not hourly: every run wakes the Neon database, and
# running 24 times a day kept it awake around the clock, which is what used
# up the free plan's compute hours. The backend's nudge window is 3 hours
# long (NUDGE_WINDOW_HOURS), so a run every 3 hours always lands inside
# anyone's window exactly once. The only cost is that a nudge can arrive up
# to 2 hours after the hour the person picked.
#
# Uses the same two repo secrets as daily-matching.yml (CRON_SECRET and
# BACKEND_URL) -- nothing new to configure.

on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch: {}

jobs:
  send-nudges:
    runs-on: ubuntu-latest
    steps:
      - name: Send due Discord nudges
        run: |
          # Render can be asleep or restarting for a minute. A 000 (no answer) or
          # 502/503/504 (Render's proxy saying the app isn't up yet) means the
          # request never reached the app, so waiting and trying again is safe.
          # Any other answer, good or bad, is final.
          for attempt in $(seq 1 10); do
            response=$(curl -s --max-time 120 -w "\n%{http_code}" -X POST \
              "${{ secrets.BACKEND_URL }}/internal/discord-nudges" \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}") || true
            http_code=$(echo "$response" | tail -n1)
            http_code=${http_code:-000}
            case "$http_code" in
              000|502|503|504)
                echo "Backend not ready (HTTP $http_code, attempt $attempt/10) -- waiting 30s"
                sleep 30 ;;
              *) break ;;
            esac
          done
          http_code=$(echo "$response" | tail -n1)
          http_code=${http_code:-000}
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Discord nudges failed with HTTP $http_code"
            exit 1
          fi
