name: Daily job matching

# Runs the scheduled matching batch job once a day, for free, via GitHub's
# own infrastructure -- no server of ours needs to stay awake to trigger
# this, which matters since Render's free tier spins down when idle.
#
# Setup:
# 1. Set CRON_SECRET on the Render backend (README has the "Scheduled
#    matching" section with details).
# 2. Add the SAME value as a GitHub Actions secret on this repo:
#    Settings -> Secrets and variables -> Actions -> New repository secret
#    Name: CRON_SECRET
# 3. Add a second secret for the backend URL:
#    Name: BACKEND_URL, Value: https://your-backend.onrender.com
#    (no trailing slash)
# 4. That's it -- this runs automatically on the schedule below. You can
#    also trigger it manually from the Actions tab any time
#    ("workflow_dispatch" below enables the "Run workflow" button).
#
# Adjust the cron schedule to whatever time works for you. The one below
# runs at 13:00 UTC daily (e.g. ~8am Eastern) -- cron times are always
# UTC on GitHub Actions regardless of where you are.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  trigger-matching:
    runs-on: ubuntu-latest
    steps:
      - name: Start the scheduled-run batch
        # /internal/scheduled-run now returns 202 immediately and does the
        # actual discovery+matching work in a background task on the
        # server -- it used to run inline and block this curl call for as
        # long as the batch took (potentially many minutes, one Claude API
        # call per unseen job per user), which meant this step's success
        # depended on a single HTTP connection staying open that whole
        # time. Grab the run_id here; the next step polls for completion.
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.BACKEND_URL }}/internal/scheduled-run" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ne 202 ]; then
            echo "Starting scheduled run failed with HTTP $http_code"
            exit 1
          fi
          run_id=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin)['run_id'])")
          echo "run_id=$run_id" >> "$GITHUB_ENV"

      - name: Wait for the scheduled-run batch to finish
        # Polls rather than holding one long connection open, since a
        # short-lived request every 15s is far less exposed to any
        # single proxy/connection timeout along the way than one curl
        # call held open for the whole batch. 240 attempts * 15s = 60
        # minutes. Widened from the original 20 -- with days of failed
        # cron runs behind this one, the very first successful run has
        # to work through however large a backlog of unseen jobs built
        # up in the meantime, one real Claude API call per job per
        # user, which is meaningfully slower than the fast-failing 400s
        # that hit this same limit during the billing outage. If your
        # user base grows enough that even 60 minutes isn't enough,
        # the better long-term fix is capping max_jobs per scheduled
        # run rather than raising this further.
        run: |
          for i in $(seq 1 240); do
            response=$(curl -s -w "\n%{http_code}" \
              "${{ secrets.BACKEND_URL }}/internal/scheduled-run/${run_id}" \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')
            if [ "$http_code" -ne 200 ]; then
              echo "Status check failed with HTTP $http_code"
              echo "$body"
              exit 1
            fi
            status=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            if [ "$status" = "success" ]; then
              echo "$body"
              exit 0
            fi
            if [ "$status" = "failed" ]; then
              echo "Scheduled run failed:"
              echo "$body"
              exit 1
            fi
            sleep 15
          done
          echo "Timed out waiting for the scheduled run to finish after 60 minutes"
          exit 1

      - name: Send daily digest emails
        # Runs right after matching, in the same job, so digests reflect
        # this run's fresh matches -- reuses the same CRON_SECRET/
        # BACKEND_URL secrets, nothing new to configure. Only emails
        # users on notification_preference='daily_digest'; a step
        # failure here doesn't roll back the matching that already
        # succeeded above.
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.BACKEND_URL }}/internal/send-digests" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Digest send failed with HTTP $http_code"
            exit 1
          fi
