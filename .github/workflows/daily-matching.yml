name: Daily job matching

# Runs the scheduled matching batch job once a day, for free, via GitHub's
# own infrastructure -- no server of ours needs to stay awake to trigger
# this, which matters since Render's free tier spins down when idle.
#
# Setup:
# 1. Set CRON_SECRET on the Render backend (README has the "Scheduled
#    matching" section with details).
# 2. Add the SAME value as a GitHub Actions secret on this repo:
#    Settings -> Secrets and variables -> Actions -> New repository secret
#    Name: CRON_SECRET
# 3. Add a second secret for the backend URL:
#    Name: BACKEND_URL, Value: https://your-backend.onrender.com
#    (no trailing slash)
# 4. That's it -- this runs automatically on the schedule below. You can
#    also trigger it manually from the Actions tab any time
#    ("workflow_dispatch" below enables the "Run workflow" button).
#
# Adjust the cron schedule to whatever time works for you. The one below
# runs at 13:00 UTC daily (e.g. ~8am Eastern) -- cron times are always
# UTC on GitHub Actions regardless of where you are.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  trigger-matching:
    runs-on: ubuntu-latest
    steps:
      - name: Run the scheduled-run batch
        # The batch runs as a background task inside the Render web
        # service, so a Render restart mid-run (memory limit, deploy)
        # kills it. On boot the server marks any run it left behind as
        # failed with an "Interrupted" error, so this step sees that
        # within a minute instead of waiting an hour, and starts the batch
        # again (up to 3 starts in all). That is safe: jobs the batch has
        # already seen are not scored twice, so a restart picks up where
        # the last one stopped.
        #
        # /internal/scheduled-run returns 202 immediately and does the work
        # in the background; this step then polls for the result every 15s
        # (a short request every 15s is far less exposed to a proxy
        # timeout than one connection held open for the whole batch). A
        # non-200 or non-JSON answer while polling is treated as a
        # transient hiccup (Render restarting) and retried. The polling
        # budget is 240 checks * 15s = 60 minutes in total, across all
        # starts.
        run: |
          polls=0
          for start in 1 2 3; do
            # Render can be asleep or restarting for a minute. A 000 (no
            # answer) or 502/503/504 means the request never reached the
            # app, so waiting and trying again is safe. Any other answer,
            # good or bad, is final.
            for attempt in $(seq 1 10); do
              response=$(curl -s --max-time 60 -w "\n%{http_code}" -X POST \
                "${{ secrets.BACKEND_URL }}/internal/scheduled-run" \
                -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}") || true
              http_code=$(echo "$response" | tail -n1)
              http_code=${http_code:-000}
              case "$http_code" in
                000|502|503|504)
                  echo "Backend not ready (HTTP $http_code, attempt $attempt/10) -- waiting 30s"
                  sleep 30 ;;
                *) break ;;
              esac
            done
            http_code=$(echo "$response" | tail -n1)
            http_code=${http_code:-000}
            body=$(echo "$response" | sed '$d')
            echo "$body"
            if [ "$http_code" -ne 202 ]; then
              echo "Starting scheduled run failed with HTTP $http_code"
              exit 1
            fi
            run_id=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin)['run_id'])")
            echo "Start $start/3: run_id=$run_id"

            interrupted=0
            while [ "$polls" -lt 240 ]; do
              polls=$((polls + 1))
              response=$(curl -s -w "\n%{http_code}" \
                "${{ secrets.BACKEND_URL }}/internal/scheduled-run/${run_id}" \
                -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}")
              http_code=$(echo "$response" | tail -n1)
              body=$(echo "$response" | sed '$d')

              if [ "$http_code" -ne 200 ]; then
                echo "Status check got HTTP $http_code (check $polls/240) -- treating as transient, will retry"
                sleep 15
                continue
              fi

              status=$(echo "$body" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status', ''))" 2>/dev/null) || status=""
              if [ -z "$status" ]; then
                echo "Status check returned 200 but body wasn't valid JSON (check $polls/240) -- treating as transient, will retry"
                sleep 15
                continue
              fi

              if [ "$status" = "success" ]; then
                echo "$body"
                exit 0
              fi
              if [ "$status" = "failed" ]; then
                echo "Scheduled run failed:"
                echo "$body"
                case "$body" in
                  *Interrupted*) interrupted=1; break ;;
                  *) exit 1 ;;
                esac
              fi
              sleep 15
            done

            if [ "$interrupted" -eq 1 ] && [ "$start" -lt 3 ]; then
              echo "The server restarted mid-run. Starting the batch again."
              sleep 20
              continue
            fi
            echo "Scheduled run did not finish (interrupted or timed out after $polls checks)"
            exit 1
          done
          exit 1

      - name: Send daily digest emails
        # Runs right after matching, in the same job, so digests reflect
        # this run's fresh matches -- reuses the same CRON_SECRET/
        # BACKEND_URL secrets, nothing new to configure. Only emails
        # users on notification_preference='daily_digest'; a step
        # failure here doesn't roll back the matching that already
        # succeeded above.
        run: |
          # Render can be asleep or restarting for a minute. A 000 (no answer) or
          # 502/503/504 (Render's proxy saying the app isn't up yet) means the
          # request never reached the app, so waiting and trying again is safe.
          # Any other answer, good or bad, is final.
          for attempt in $(seq 1 10); do
            response=$(curl -s --max-time 120 -w "\n%{http_code}" -X POST \
              "${{ secrets.BACKEND_URL }}/internal/send-digests" \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}") || true
            http_code=$(echo "$response" | tail -n1)
            http_code=${http_code:-000}
            case "$http_code" in
              000|502|503|504)
                echo "Backend not ready (HTTP $http_code, attempt $attempt/10) -- waiting 30s"
                sleep 30 ;;
              *) break ;;
            esac
          done
          http_code=$(echo "$response" | tail -n1)
          http_code=${http_code:-000}
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Digest send failed with HTTP $http_code"
            exit 1
          fi
