name: Daily culture bot

# Runs the Culture Bot's daily lesson delivery, for free, via GitHub's
# own infrastructure -- same reasoning as daily-matching.yml: Render's
# free tier spins down when idle, so nothing inside the web process can
# reliably wake itself up on a schedule.
#
# Setup: this reuses the SAME CRON_SECRET and BACKEND_URL secrets as
# daily-matching.yml -- if you've already set those up for scheduled
# matching, there's nothing new to configure here. See README's
# "Culture Bot lessons" section for details if you haven't.
#
# Runs at 13:05 UTC daily, five minutes after the matching job, so the
# two don't hit the (free-tier, single-instance) backend at the exact
# same moment. Adjust to whatever time works for you.

on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch: {}

jobs:
  trigger-culture-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Call the culture-bot-run endpoint
        run: |
          # Render can be asleep or restarting for a minute. A 000 (no answer) or
          # 502/503/504 (Render's proxy saying the app isn't up yet) means the
          # request never reached the app, so waiting and trying again is safe.
          # Any other answer, good or bad, is final.
          for attempt in $(seq 1 10); do
            response=$(curl -s --max-time 120 -w "\n%{http_code}" -X POST \
              "${{ secrets.BACKEND_URL }}/internal/culture-bot-run" \
              -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}") || true
            http_code=$(echo "$response" | tail -n1)
            http_code=${http_code:-000}
            case "$http_code" in
              000|502|503|504)
                echo "Backend not ready (HTTP $http_code, attempt $attempt/10) -- waiting 30s"
                sleep 30 ;;
              *) break ;;
            esac
          done
          http_code=$(echo "$response" | tail -n1)
          http_code=${http_code:-000}
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$http_code" -ne 200 ]; then
            echo "Culture bot run failed with HTTP $http_code"
            exit 1
          fi
