<!doctype html><html><body>
<form>
  <label for="a">Legally authorized to work in the United States? <select id="a"><option value="">Select...</option><option>Yes</option><option>No</option></select></label><br>
  <fieldset><legend>Will you now or in the future require visa sponsorship?</legend>
    <label><input type="radio" name="sp" value="y"> Yes</label> <label><input type="radio" name="sp" value="n"> No</label></fieldset>
  <label for="rl">Are you willing to relocate? <select id="rl"><option value="">Please select</option><option>Yes, but I will need assistance</option><option>No</option></select></label><br>
  <label>Desired salary <input id="sal" type="text"></label><br>
  <label>Notice period <input id="np" type="text"></label><br>
  <label>Why do you want to work here? <textarea id="why"></textarea></label><br>
  <label>Tell us about a time you led a project <textarea id="other"></textarea></label><br>

  <div class="job"><label>Job Title <input class="jt"></label><label>Company <input class="jc"></label>
    <label>Start Date <input class="js" placeholder="MM/YYYY"></label><label>End Date <input class="je" placeholder="MM/YYYY"></label>
    <label>Description <textarea class="jd"></textarea></label></div>
  <div class="job"><label>Job Title <input class="jt"></label><label>Company <input class="jc"></label>
    <label>Start Date <input class="js" placeholder="MM/YYYY"></label><label>End Date <input class="je" placeholder="MM/YYYY"></label></div>

  <div class="edu"><label>School <input id="sc"></label><label>Degree <input id="dg"></label><label>Field of Study <input id="fs"></label>
    <label>Start Date <input id="es" placeholder="YYYY"></label><label>End Date <input id="ee" placeholder="YYYY"></label></div>

  <label for="g">Gender <select id="g"><option value="">Select</option><option>Male</option><option>Female</option><option>Decline to self-identify</option></select></label>
  <label for="r">Race <select id="r"><option value="">Select</option><option>Asian (Not Hispanic or Latino)</option><option>White</option><option>I do not wish to answer</option></select></label>
  <label for="v">Veteran Status <select id="v"><option value="">Select</option><option>I am not a protected veteran</option><option>I identify as one or more of the classifications of protected veteran</option><option>I don't wish to answer</option></select></label>
  <label for="d">Disability Status <select id="d"><option value="">Select</option><option>Yes, I have a disability</option><option>No, I do not have a disability</option><option>I do not want to answer</option></select></label>
</form></body></html>
