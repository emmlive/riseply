<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Riseply</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 280px;
      font-family: -apple-system, 'Inter', sans-serif;
      color: #16233D;
      background: #FFFFFF;
    }
    .header {
      background: #1F7A6C;
      color: white;
      padding: 14px 16px;
      font-weight: 700;
      font-size: 15px;
    }
    .body { padding: 16px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; margin-top: 10px; }
    label:first-child { margin-top: 0; }
    input {
      width: 100%; padding: 8px 10px; border: 1px solid #E2E5EA; border-radius: 6px;
      font-size: 13px; font-family: inherit;
    }
    button {
      width: 100%; padding: 9px 10px; border: none; border-radius: 8px;
      font-weight: 600; font-size: 13px; cursor: pointer; margin-top: 14px;
    }
    button.primary { background: #1F7A6C; color: white; }
    button.primary:hover { background: #17604F; }
    button.primary:disabled { opacity: 0.6; cursor: default; }
    button.ghost { background: #E4F0EC; color: #17604F; }
    .error { color: #B23B3B; font-size: 12px; margin-top: 8px; }
    .status { text-align: center; }
    .status .name { font-weight: 700; margin-bottom: 2px; }
    .status .email { color: #5B6478; font-size: 12px; margin-bottom: 14px; }
    .hint { font-size: 11px; color: #5B6478; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="header">Riseply Autofill</div>
  <div class="body" id="app">Loading…</div>
  <script src="popup.js"></script>
</body>
</html>
